# ============================================================
# Free Egg Credits · DSH 配置片段
# 把下面两段分别合并到：
#   C:\Users\<你>\.dsh\profiles\<profile>\cordis.patch.yml
# 改完重启 DSH（Host 半改动必须重启；只改 Client 刷新页面即可）。
# ============================================================

# 1) 插件配置：确认已安装 dsh-free-egg-credits 后，把这段追加到文件末尾
- id: free-egg-credits
  config:
    gatewayBaseUrl: 'http://127.0.0.1:{{WB_PORT}}'
    gatewayConfigPath: '{{ROOT}}/workbuddy/config.json'
    qoder:
      baseUrl: 'http://127.0.0.1:{{QODER_PORT}}'
      panelPasswordFile: '{{ROOT}}/qoder/.panel-password'
    # 可选：New API 建好两个渠道、并生成管理员 access token 后取消注释
    # newApi:
    #   baseUrl: 'http://127.0.0.1:{{NEWAPI_PORT}}'
    #   userId: 1
    #   accessTokenFile: '{{ROOT}}/newapi/access-token'
    #   channels:
    #     workbuddy: 1     # 改成 New API 里 WorkBuddy 渠道的真实 id
    #     qoder: 2         # 改成 Qoder 渠道的真实 id
    #   priorities:
    #     preferred: 10
    #     fallback: 5
