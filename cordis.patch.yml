# WorkBuddy 积分插件：Host 半负责读本地网关与折算积分，Client 半负责界面。
# 配置项均可省略；下面列出的是默认值，需要改时直接改这里（用户 patch 层随升级保留）。
- insert:
    - id: free-egg-credits
      name: 'dsh-free-egg-credits'
      config:
        # 本地 WorkBuddy 反代网关地址（面板 /panel/api/* 的宿主）。
        gatewayBaseUrl: 'http://127.0.0.1:7863'
        # 网关配置文件：从中读取 api_key；留空则用本插件包目录上两级的 config.json。
        gatewayConfigPath: ''
        # 只统计这些域的账号（国内账号 = cn）。
        realms: [cn]
        # 面板自动补签：打开界面时若当天还没有签到结果，就调用一次单号签到接口
        # 判定状态（已签到是幂等的；未签到则顺带完成当天签到）。
        autoCheckin: true
        # 几点之后才做自动补签（避免凌晨误触发）。
        checkinAfterHour: 8
        # 签到失败后的重试间隔（分钟）。
        checkinRetryMinutes: 10
        # 网关快照缓存时长（秒）。
        refreshSeconds: 30
        # 积分单价覆盖：模型名 → 积分/千 token。留空则用网关实测扣费台账折算。
        # 注意这是「混合单价」，会忽略缓存命中折扣；WorkBuddy 优先用下面的分类型单价。
        creditsPer1k: {}
        # WorkBuddy 逐 token 类型单价：模型名 → { input, cache, output }，单位积分/千 token。
        # 留空使用内置实测值（deepseek-v4.1-flash）；上游调价后可在这里覆盖。
        # tokenRates:
        #   deepseek-v4.1-flash:
        #     input: 0.014444
        #     cache: 0.0001962
        #     output: 0.059415
        # 哪些 DSH provider 视为「free-egg 模型」：这些 provider 的对话即使还没算出单价，
        # 输入框下方也常显积分预估（默认 free-egg / workbuddy / qoder / new-api）。
        freeEggProviders: [free-egg, workbuddy, qoder, new-api]
        # 目录倍率折算的兜底基线（积分/千 token/倍率单位）；0 = 只用实测台账自动校准。
        catalogBaseCreditsPer1k: 0
        # Qoder 反代网关（qoder2api-hub，127.0.0.1:8790）：积分并列显示。
        # panelPasswordFile 指向面板密码文件（本机路径，勿提交进仓库）；留空回退面板默认 admin。
        qoder:
          baseUrl: 'http://127.0.0.1:8790'
          panelPasswordFile: ''
        # 「积分优先消耗」切换（可选）：通过 new-api 管理接口改两个渠道的优先级。
        # accessTokenFile 指向「只含管理员 access token」的文件；也可用 accessToken 内联。
        # 不配置则整块 UI 隐藏，插件其余行为不变（默认关闭）。
        # newApi:
        #   baseUrl: 'http://127.0.0.1:3001'
        #   userId: 1
        #   accessTokenFile: ''
        #   channels:
        #     workbuddy: 13
        #     qoder: 12
        #   priorities:
        #     preferred: 10
        #     fallback: 5
